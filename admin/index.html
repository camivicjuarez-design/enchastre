<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Administración — Enchastre.bba</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #f5f0e6;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      flex-direction: column;
      gap: 1rem;
      color: #333;
    }
    .loading p { margin: 0; font-size: 0.95rem; }
  </style>
</head>
<body>
  <div class="loading" id="loading">
    <p>Cargando panel de administración…</p>
    <p style="font-size:0.8rem;opacity:0.7">Si esta pantalla no desaparece, verificá la configuración de Netlify Identity / Git Gateway.</p>
  </div>

  <script src="https://unpkg.com/decap-cms@^3.1.2/dist/decap-cms.js"></script>
  <script>
    // Cuando Decap se inicializa, oculta el mensaje de carga
    window.addEventListener("load", function () {
      setTimeout(function () {
        var el = document.getElementById("loading");
        if (el) el.style.display = "none";
      }, 1200);
    });
  </script>
</body>
</html>
